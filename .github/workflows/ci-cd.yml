name: CI/CD Pipeline - Dietary Guidance RAG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Python 3.11 + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify corpus dataset integrity
        run: |
          python -c "import json; lines = open('data/blocks.jsonl', 'r', encoding='utf-8').readlines(); assert len(lines) == 1001, f'Expected 1001 blocks, got {len(lines)}'; print(f'Corpus integrity confirmed: {len(lines)} blocks')"

      - name: Run Pytest test suite
        run: |
          pytest tests/test_api.py tests/test_chunking.py tests/test_guardrails.py tests/test_retrieval.py tests/test_synthesis.py tests/test_streaming.py -v

  frontend-ci:
    name: Frontend CI (Next.js 15 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check & Next.js production build
        run: npm run build
        env:
          BACKEND_URL: "http://127.0.0.1:8000"

  deploy-railway:
    name: Continuous Deployment - Railway Backend
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Railway via CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway GitHub App Notice
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "Note: Railway GitHub Integration automatically triggers container deployment from the 'main' branch."

  deploy-vercel:
    name: Continuous Deployment - Vercel Frontend
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel via CLI
        if: env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel
          cd frontend
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel GitHub App Notice
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "Note: Vercel GitHub Integration automatically triggers preview and production deployments on commit/PR to 'main'."
